<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Battle</title>
  <link rel="stylesheet" href="/static/display/display.css">
</head>
<body>
  <main id="game">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay hidden">
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
    </div>
  </main>

  <aside id="side">
    <div id="round-info" class="round-info hidden">
      <span id="ri-time" class="ri-time"></span>
      <span id="ri-target" class="ri-target"></span>
    </div>

    <section id="leaderboard" class="panel">
      <header>
        <h1 id="lb-title"></h1>
        <span id="lb-round"></span>
      </header>
      <ol id="lb-list"></ol>
      <p id="lb-empty" class="muted"></p>
    </section>

    <section id="records" class="panel hidden">
      <header class="records-head">
        <div>
          <div id="rec-kicker" class="kicker"></div>
          <h1 id="rec-title"></h1>
        </div>
        <div id="rec-dots" class="dots"></div>
      </header>
      <div id="rec-body" class="rec-body">
        <ol id="rec-list" class="records-list"></ol>
        <p id="rec-empty" class="muted small"></p>
      </div>
    </section>

    <section id="join" class="panel hidden">
      <h1 id="join-title"></h1>
      <div class="qr-row">
        <figure>
          <img src="/qr/wifi.svg" alt="" id="qr-wifi">
          <figcaption>
            <strong id="join-step1-title"></strong>
            <span id="join-step1-text"></span>
            <span id="join-ssid" class="detail"></span>
            <span id="join-wifipass" class="detail"></span>
          </figcaption>
        </figure>
        <figure>
          <img src="/qr/play.svg" alt="" id="qr-play">
          <figcaption>
            <strong id="join-step2-title"></strong>
            <span id="join-step2-text"></span>
            <span id="join-url" class="detail"></span>
          </figcaption>
        </figure>
      </div>
      <p id="join-step3" class="warning"></p>
    </section>

    <p id="keyboard-hint" class="hint hidden"></p>

    <nav id="side-nav" class="side-nav hidden">
      <button type="button" id="nav-prev" class="nav-btn"></button>
      <button type="button" id="nav-next" class="nav-btn"></button>
    </nav>
  </aside>

  <div id="connection" class="connection hidden"></div>

  <script type="module" src="/static/display/display.js"></script>
</body>
</html>
